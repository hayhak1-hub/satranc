name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;29.0.14206865" > /dev/null

      - name: Build host Stockfish for engine tests
        run: make -C engine/stockfish -j4 build ARCH=x86-64-modern COMP=gcc > /dev/null

      - name: Test
        env:
          STOCKFISH_PATH: ${{ github.workspace }}/engine/stockfish/stockfish
        run: ./gradlew :chess-core:test :app:testDebugUnitTest --console=plain

      - name: Build APK and App Bundle
        run: ./gradlew assembleDebug bundleRelease lintDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: satranc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
